
<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Testovací projekt | Hack Club Melčice</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, sans-serif;
      background: #101014;
      color: #f5f5f5;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: 100%;
      max-width: 620px;
      padding: 40px;
      background: #1c1c23;
      border: 1px solid #35353f;
      border-radius: 24px;
    }

    .tag {
      display: inline-block;
      padding: 7px 12px;
      border-radius: 100px;
      background: #d9ff66;
      color: #171717;
      font-size: 12px;
      font-weight: 800;
    }

    h1 {
      font-size: clamp(34px, 8vw, 54px);
      line-height: 1.05;
      letter-spacing: -2px;
      margin: 24px 0 16px;
    }

    p {
      color: #b8b8c5;
      line-height: 1.7;
    }

    button {
      margin-top: 18px;
      padding: 13px 18px;
      border: none;
      border-radius: 12px;
      background: #d9ff66;
      color: #171717;
      font-size: 15px;
      font-weight: 750;
      cursor: pointer;
    }

    button:hover {
      background: #c8f34d;
      transform: translateY(-2px);
    }

    #message {
      margin-top: 20px;
      color: #d9ff66;
      font-weight: 600;
    }

    footer {
      margin-top: 35px;
      padding-top: 20px;
      border-top: 1px solid #35353f;
      font-size: 12px;
      color: #888895;
    }
  </style>
</head>

<body>
  <main>
    <span class="tag">HACK CLUB MELČICE</span>

    <h1>Môj prvý web. 🚀</h1>

    <p>
      Toto je testovacia stránka vytvorená pomocou HTML, CSS
      a JavaScriptu. Ak ju vidíš na svojej vlastnej URL,
      nasadenie funguje!
    </p>

    <button id="testButton">Otestovať JavaScript →</button>

    <div id="message" aria-live="polite"></div>

    <footer>
      TEST PROJECT · Hack Club Melčice · 2026
    </footer>
  </main>

  <script>
    const button = document.getElementById("testButton");
    const message = document.getElementById("message");

    button.addEventListener("click", () => {
      message.textContent =
        "Funguje to! HTML, CSS aj JavaScript sú online. 🎉";

      button.textContent = "Test úspešný ✓";
    });
  </script>
</body>
</html>
